<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pilotage Atelier — Connexion</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #121417; color: #e8e8e6; font-family: 'IBM Plex Sans', ui-sans-serif, system-ui;
  }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  .box { width: 100%; max-width: 360px; padding: 32px; background: #171a1e; border: 1px solid #22262b; border-radius: 10px; }
  .eyebrow { font-size: 12px; letter-spacing: 0.12em; color: #5c8b98; text-transform: uppercase; margin-bottom: 6px; }
  h1 { font-size: 20px; font-weight: 700; margin: 0 0 20px 0; color: #f2f2f0; }
  label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #7c8792; margin-bottom: 5px; }
  .field { margin-bottom: 14px; }
  input {
    width: 100%; background: #1a1d21; border: 1px solid #2c3036; color: #e8e8e6;
    padding: 10px 12px; border-radius: 6px; font-size: 14px; outline: none;
  }
  input:focus { border-color: #4a6b7a; }
  button {
    width: 100%; margin-top: 8px; background: linear-gradient(180deg, #3a7d8c, #2c6270);
    color: #f0f7f8; border: 1px solid #4a8c9c; border-radius: 6px; font-size: 14px; font-weight: 600;
    padding: 11px; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .error { background: #2a1c1c; border: 1px solid #5e2e2e; color: #e08a8a; border-radius: 6px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px; display: none; }
</style>
</head>
<body>
  <div class="box">
    <div class="eyebrow">Pilotage Atelier</div>
    <h1>Connexion</h1>
    <div class="error" id="error-box"></div>
    <form id="login-form">
      <div class="field">
        <label>Nom d'utilisateur</label>
        <input type="text" id="username" autocomplete="username" autofocus />
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <input type="password" id="password" autocomplete="current-password" />
      </div>
      <button type="submit" id="btn-login">Se connecter</button>
    </form>
  </div>

<script>
const SUPABASE_URL = "https://dbxhmneliwhiwmzduahb.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRieGhtbmVsaXdoaXdtemR1YWhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4Njg2MjYsImV4cCI6MjEwMTQ0NDYyNn0.zOecIGcm2vdqWCCFJ8FKq08_IwjzCEdy7MNdKv9SvS8";
const AUTH_DOMAIN = "pilotage-atelier.local";
const SESSION_KEY = "pilotage_session";

// Si déjà connecté, direct vers l'accueil
if (localStorage.getItem(SESSION_KEY)) {
  window.location.href = "index.html";
}

function showError(msg) {
  const box = document.getElementById("error-box");
  box.textContent = msg;
  box.style.display = "block";
}

document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const username = document.getElementById("username").value.trim().toLowerCase();
  const password = document.getElementById("password").value;
  if (!username || !password) return;
  const btn = document.getElementById("btn-login");
  btn.disabled = true; btn.textContent = "Connexion…";
  document.getElementById("error-box").style.display = "none";

  try {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: "POST",
      headers: { apikey: SUPABASE_ANON_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ email: `${username}@${AUTH_DOMAIN}`, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error_description || data.msg || "Identifiants incorrects.");

    // Récupère le profil (nom, rôle) associé
    const profRes = await fetch(`${SUPABASE_URL}/rest/v1/profils?id=eq.${data.user.id}&select=*`, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${data.access_token}` },
    });
    const profiles = await profRes.json();
    const profil = profiles[0] || { username, nom: username, role: "Atelier" };

    localStorage.setItem(SESSION_KEY, JSON.stringify({
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      user_id: data.user.id,
      username: profil.username,
      nom: profil.nom,
      role: profil.role,
    }));
    window.location.href = "index.html";
  } catch (err) {
    showError(err.message === "Invalid login credentials" ? "Nom d'utilisateur ou mot de passe incorrect." : err.message);
  } finally {
    btn.disabled = false; btn.textContent = "Se connecter";
  }
});
</script>
</body>
</html>
